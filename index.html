<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সাইট মেইনটেনেন্সে আছে</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
  }
  .box { max-width:520px; }
  .icon { font-size:56px; margin-bottom:20px; }
  h1 {
    font-size: clamp(22px, 5vw, 34px);
    margin-bottom:14px;
    font-weight:700;
  }
  p {
    font-size: clamp(14px, 3vw, 17px);
    color:#cbd5e1;
    line-height:1.6;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🛠️</div>
    <h1>সাইটটি বর্তমানে মেইনটেনেন্সের কাজ চলছে</h1>
    <p>আমরা সাইটটিকে আরও ভালো করার কাজ করছি। অনুগ্রহ করে কিছুক্ষণ পরে আবার চেষ্টা করুন। আপনার ধৈর্যের জন্য ধন্যবাদ।</p>
  </div>
</body>
</html>
